name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (git ls-remote https://github.com/actions/checkout refs/tags/v6)

      - name: Select stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (git ls-remote https://github.com/dtolnay/rust-toolchain refs/heads/stable)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1 (git ls-remote https://github.com/Swatinem/rust-cache refs/tags/v2)

      - name: Generate lockfile for supply-chain gates
        run: cargo generate-lockfile

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run example
        run: cargo run --example demo

      - name: Compile benches
        run: cargo bench --no-run

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check
